---
# Electric Meter Package - Generic OBIS smart meter support
#
# Reads push-mode IEC 62056-21 text meters and SML meters alike: with 8
# data bits and no parity both arrive as the same OBIS text lines
# (electricity_meter_reader component).
#
# IMPORTANT: This package requires the custom electricity_meter_reader,
# uart_edge_rx and deduplicate_text components. You must include this in
# your main configuration:
# external_components:
#   - source:
#       type: local
#       path: components
#
# The substitutions a main configuration must define are listed in
# README-electricity-meter.md ("Required Substitutions").

# Tunables with defaults; a main configuration overrides any of them by
# defining the same substitution.
substitutions:
  # Line filter: shorter lines are noise, not OBIS readings
  obis_min_line_length: "10"
  # Identical text readings in a row before a text sensor publishes
  text_sensor_confirmations: "3"
  # Sensor publishing: at most one update per throttle period unless the
  # value moved by at least the group's delta
  meter_sensor_throttle: 5min
  energy_sensor_delta: "0.001"  # kWh
  power_sensor_delta: "0.5"  # W
  voltage_sensor_delta: "0.05"  # V
  current_sensor_delta: "0.005"  # A
  frequency_sensor_delta: "0.05"  # Hz
  phase_angle_sensor_delta: "0.5"  # degrees
  # Communication quality sensors
  quality_sensor_update_interval: 30s
  quality_sensor_throttle: 2min
  frame_rate_sensor_delta: "0.1"  # percentage points
  uart_lines_sensor_delta: "0.5"  # lines
  # ESP8266 heap sweep
  heap_sweep_interval: 5min
  heap_sweep_startup_delay: 2min
  heap_sweep_block_margin: "32"  # bytes left free below the largest block
  heap_sweep_min_free_to_start: "8192"  # bytes
  heap_sweep_min_free_during: "6144"  # bytes
  heap_sweep_max_fragmentation_percent: "80.0"
  heap_sweep_max_block_divisor: "32"  # blocks of max/1, /2, /4 ... /this
  heap_sweep_min_block: "256"  # bytes

# UART for IR head communication
uart:
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}
  id: uart_bus
  parity: ${uart_parity}
  data_bits: ${uart_data_bits}
  stop_bits: ${uart_stop_bits}
  rx_buffer_size: ${uart_rx_buffer_size}

# On an ESP8266 RX pin without a hardware UART, receive by edge timing
# instead of ESPHome's interrupt-blocking software UART; does nothing on a
# hardware UART or on the ESP32.
uart_edge_rx:
  - uart_id: uart_bus

# Global variables for validation state tracking
globals:
  - id: prev_total_consumption
    type: float
    initial_value: "-1.0"
  - id: prev_total_feed_in
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_1d
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_7d
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_30d
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_365d
    type: float
    initial_value: "-1.0"
  - id: prev_current_power
    type: float
    initial_value: "-1.0"
  - id: prev_power_l1
    type: float
    initial_value: "-1.0"
  - id: prev_power_l2
    type: float
    initial_value: "-1.0"
  - id: prev_power_l3
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_t1
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_t2
    type: float
    initial_value: "-1.0"
  - id: prev_consumption_since_reset
    type: float
    initial_value: "-1.0"
  - id: prev_current_l1
    type: float
    initial_value: "-1.0"
  - id: prev_current_l2
    type: float
    initial_value: "-1.0"
  - id: prev_current_l3
    type: float
    initial_value: "-1.0"
  - id: total_frames_received
    type: uint32_t
    initial_value: "0"
  - id: corruption_count
    type: uint32_t
    initial_value: "0"
  - id: serial_number_last_hash
    type: uint32_t
    initial_value: "0"
  - id: serial_number_count
    type: int
    initial_value: "0"
  - id: firmware_version_last_hash
    type: uint32_t
    initial_value: "0"
  - id: firmware_version_count
    type: int
    initial_value: "0"
  - id: parameter_crc_last_hash
    type: uint32_t
    initial_value: "0"
  - id: parameter_crc_count
    type: int
    initial_value: "0"
  - id: status_register_last_hash
    type: uint32_t
    initial_value: "0"
  - id: status_register_count
    type: int
    initial_value: "0"
  # While positioning mode is on: every line the reader delivers, counted
  # before the line filter, plus the lines lost with each dropped SML
  # telegram. Distinguishes "no data" from "data rejected by the filter";
  # total_frames_received counts only lines that passed the filter, plus
  # lost lines.
  - id: uart_lines_seen
    type: uint32_t
    initial_value: "0"

# OBIS data parsing text sensor: one line per state, from text meters and
# SML meters alike
text_sensor:
  - platform: electricity_meter_reader
    uart_id: uart_bus
    name: "OBIS Raw Line"
    id: obis_raw_line
    internal: true
    # A dropped SML telegram counts as the lines it would have carried, all
    # corrupt, so the quality sensors and positioning mode see it.
    on_telegram_dropped:
      - lambda: |-
          id(total_frames_received) += lines_lost;
          id(corruption_count) += lines_lost;
          // Stops at UINT32_MAX instead of wrapping, like the filter below.
          if (id(positioning_mode).state) {
            id(uart_lines_seen) =
                UINT32_MAX - id(uart_lines_seen) < lines_lost
                    ? UINT32_MAX
                    : id(uart_lines_seen) + lines_lost;
          }
    filters:
      - lambda: |-
          constexpr size_t MIN_OBIS_LINE_LEN = ${obis_min_line_length};
          // Characters of a raw line logged in positioning mode.
          constexpr size_t RAW_LOG_MAX_CHARS = 64;
          // Count and log every raw line (pre-filter) only while positioning
          // mode is active. The counter stops at UINT32_MAX instead of
          // wrapping.
          if (id(positioning_mode).state) {
            if (id(uart_lines_seen) < UINT32_MAX) id(uart_lines_seen)++;
            char raw_buf[RAW_LOG_MAX_CHARS + 1];
            size_t raw_len = std::min(x.length(), RAW_LOG_MAX_CHARS);
            memcpy(raw_buf, x.c_str(), raw_len);
            raw_buf[raw_len] = '\0';
            ESP_LOGI("meter_raw", "RAW: [%s]", raw_buf);
          }
          if (x.length() < MIN_OBIS_LINE_LEN) return {};
          if (x[0] != '0' && x[0] != '1') return {};
          if (x.find('*') == std::string::npos ||
              x.find('(') == std::string::npos ||
              x.find(')') == std::string::npos) return {};
          return x;
    on_value:
      then:
        - lambda: |-
            // Track OBIS telegram processing for quality metrics
            id(total_frames_received)++;

            // Flag to track if corruption occurred in this telegram
            bool telegram_corrupted = false;

            // Validation constants from substitutions
            const float MAX_POWER_CHANGE = ${max_power_change};
            const float MAX_CURRENT_CHANGE = ${max_current_change};
            const float MAX_ENERGY_CHANGE = ${max_energy_change};
            const float MAX_ROLLING_ENERGY_CHANGE =
                ${max_rolling_energy_change};

            // Range validation constants
            const float MIN_ENERGY_VALUE = ${min_energy_value};
            const float MAX_ENERGY_TOTAL = ${max_energy_total};
            const float MAX_CONSUMPTION_1D = ${max_consumption_1d};
            const float MAX_CONSUMPTION_7D = ${max_consumption_7d};
            const float MAX_CONSUMPTION_30D = ${max_consumption_30d};
            const float MAX_CONSUMPTION_365D = ${max_consumption_365d};
            const float MIN_POWER_VALUE = ${min_power_value};
            const float MAX_ABSOLUTE_POWER = ${max_absolute_power};
            const float MIN_VOLTAGE = ${min_voltage};
            const float MAX_VOLTAGE = ${max_voltage};
            const float MIN_CURRENT = ${min_current};
            const float MAX_CURRENT = ${max_current};
            const float MIN_FREQUENCY = ${min_frequency};
            const float MAX_FREQUENCY = ${max_frequency};
            const float MIN_PHASE_ANGLE = ${min_phase_angle};
            const float MAX_PHASE_ANGLE = ${max_phase_angle};

            // Feature flags from substitutions (process if NOT disabled)
            constexpr bool ENABLE_CORE_SENSORS =
                ("${disabled_core_sensors}"[0] != 't');
            constexpr bool ENABLE_FEED_IN_SENSORS =
                ("${disabled_feed_in_sensors}"[0] != 't');
            constexpr bool ENABLE_PHASE_POWER_SENSORS =
                ("${disabled_phase_power_sensors}"[0] != 't');
            constexpr bool ENABLE_VOLTAGE_SENSORS =
                ("${disabled_voltage_sensors}"[0] != 't');
            constexpr bool ENABLE_CURRENT_SENSORS =
                ("${disabled_current_sensors}"[0] != 't');
            constexpr bool ENABLE_FREQUENCY_SENSORS =
                ("${disabled_frequency_sensors}"[0] != 't');
            constexpr bool ENABLE_PHASE_ANGLE_SENSORS =
                ("${disabled_phase_angle_sensors}"[0] != 't');
            constexpr bool ENABLE_TARIFF_SENSORS =
                ("${disabled_tariff_sensors}"[0] != 't');
            constexpr bool ENABLE_CONSUMPTION_SINCE_RESET_SENSORS =
                ("${disabled_consumption_since_reset_sensors}"[0] !=
                 't');
            constexpr bool ENABLE_ROLLING_WINDOW_SENSORS =
                ("${disabled_rolling_window_sensors}"[0] != 't');
            constexpr bool ENABLE_DIAGNOSTIC_SENSORS =
                ("${disabled_diagnostic_sensors}"[0] != 't');

            // Static, so the capture-less helpers below can use them.
            // Characters of a field shown in a log line.
            static constexpr size_t LOG_FIELD_MAX_CHARS = 30;
            // Longest number text parse_float reads; longer text is cut.
            static constexpr size_t NUMBER_MAX_CHARS = 31;
            // FNV-1a 32-bit parameters.
            static constexpr uint32_t FNV_OFFSET_BASIS = 2166136261U;
            static constexpr uint32_t FNV_PRIME = 16777619U;
            static constexpr int TEXT_CONFIRMATIONS =
                ${text_sensor_confirmations};

            // Helpers to trim text for a log line without allocation. Each
            // has its own thread-local buffer, so one log call may use both,
            // but not the same one twice.
            auto trim_for_log = [](const std::string &str) -> const char* {
              thread_local char buf[LOG_FIELD_MAX_CHARS + 1];
              size_t len = std::min(str.length(), LOG_FIELD_MAX_CHARS);
              memcpy(buf, str.c_str(), len);
              buf[len] = '\0';
              return buf;
            };

            auto trim_sv_for_log = [](std::string_view text) -> const char* {
              thread_local char buf[LOG_FIELD_MAX_CHARS + 1];
              size_t len = std::min(text.length(), LOG_FIELD_MAX_CHARS);
              memcpy(buf, text.data(), len);
              buf[len] = '\0';
              return buf;
            };

            // Helper macro for conditional warning logging - zero overhead when
            // disabled
            #define LOG_WARNING_IF_ENABLED(format, ...) \
              do { \
                if (id(enable_warning_logs).state) { \
                  ESP_LOGW("meter", format, ##__VA_ARGS__); \
                } \
              } while(0)

            // Lightweight helper: parse float from a std::string_view without
            // heap allocations
            auto parse_float = [](std::string_view text) -> float {
              if (text.empty()) return NAN;
              char buf[NUMBER_MAX_CHARS + 1];
              size_t len = std::min(text.size(), NUMBER_MAX_CHARS);
              memcpy(buf, text.data(), len);
              buf[len] = '\0';

              char *endptr = nullptr;
              errno = 0;  // Clear errno before strtof
              float val = strtof(buf, &endptr);
              // Check for parsing errors: no characters processed, extra junk,
              // or errno set
              if (endptr == buf || *endptr != '\0' || errno != 0) {
                return NAN;
              }
              return val;
            };

            // FNV-1a hash: memory-efficient duplicate detection at run time,
            // and the OBIS code switch below at compile time
            constexpr auto calculate_hash =
                [](std::string_view text) constexpr -> uint32_t {
              uint32_t hash = FNV_OFFSET_BASIS;
              for (char character : text) {
                hash ^= static_cast<uint32_t>(character);
                hash *= FNV_PRIME;
              }
              return hash;
            };

            // Extract OBIS code from the current line - returns string_view for
            // efficiency
            auto extract_obis_code =
                [&](const std::string &line) -> std::string_view {
              // Find the first '(' character
              size_t start = line.find('(');
              if (start == std::string::npos) {
                LOG_WARNING_IF_ENABLED("No '(' found in line");
                telegram_corrupted = true;
                return {};
              }

              // OBIS code is everything before the first '('
              std::string_view obis_code =
                  std::string_view(line).substr(0, start);

              // Trim any whitespace - following same pattern as
              // parse_obis_string_value
              size_t first_non_space = obis_code.find_first_not_of(" \t\r\n");
              if (first_non_space == std::string::npos) {
                LOG_WARNING_IF_ENABLED("Only whitespace before '('");
                telegram_corrupted = true;
                return {};
              }

              size_t last_non_space = obis_code.find_last_not_of(" \t\r\n");
              return obis_code.substr(first_non_space,
                                      last_non_space - first_non_space + 1);
            };

            // Parse OBIS string value from line, returned as string_view to
            // avoid allocations
            auto parse_obis_string_value =
                [&](const std::string &line, const std::string &obis,
                    char delimiter) -> std::string_view {
              size_t pos = line.find(obis);
              if (pos == std::string::npos) {
                return {};
              }

              size_t start = line.find('(', pos);
              if (start == std::string::npos) {
                LOG_WARNING_IF_ENABLED("No '(' for %s", trim_for_log(obis));
                telegram_corrupted = true;
                return {};
              }

              size_t end = line.find(delimiter, start);
              if (end == std::string::npos || end <= start) {
                LOG_WARNING_IF_ENABLED("No '%c' for %s", delimiter,
                                       trim_for_log(obis));
                telegram_corrupted = true;
                return {};
              }

              return std::string_view(line).substr(start + 1, end - start - 1);
            };

            // Parse OBIS numeric value from line, return NAN if not found or
            // invalid
            auto parse_obis_value = [&](const std::string &line,
                                        const std::string &obis) -> float {
              std::string_view value_sv =
                  parse_obis_string_value(line, obis, '*');
              if (value_sv.empty()) {
                return NAN;
              }

              float value = parse_float(value_sv);
              if (isnan(value)) {
                LOG_WARNING_IF_ENABLED("Bad float %s: %s", trim_for_log(obis),
                                       trim_sv_for_log(value_sv));
                telegram_corrupted = true;
              }
              return value;
            };

            // Validate and update monotonic energy sensors (kWh)
            auto update_energy_sensor = [&](const std::string &line,
                                            const std::string &obis,
                                            auto &sensor, float &prev_value,
                                            float min_range, float max_range) {
              float value = parse_obis_value(line, obis);
              if (isnan(value)) {
                return;
              }

              // Validate: energy must be in valid range
              if (value < min_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.2f<%.1f",
                                       trim_for_log(obis), value, min_range);
                telegram_corrupted = true;
                return;
              }
              if (value > max_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.2f>%.1f",
                                       trim_for_log(obis), value, max_range);
                telegram_corrupted = true;
                return;
              }

              // Validate: energy must be evergrowing (or first reading)
              if (prev_value >= 0 && value < prev_value) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.2f<%.2f",
                                       trim_for_log(obis), value, prev_value);
                telegram_corrupted = true;
                return;
              }

              // Validate: energy change must be reasonable
              if (prev_value >= 0 && (value - prev_value) > MAX_ENERGY_CHANGE) {
                LOG_WARNING_IF_ENABLED("Reject %s: Δ%.2f>%.0f",
                                       trim_for_log(obis), value - prev_value,
                                       MAX_ENERGY_CHANGE);
                telegram_corrupted = true;
                return;
              }

              sensor->publish_state(value);
              prev_value = value;
              ESP_LOGD("meter", "Updated %s: %.4f kWh", trim_for_log(obis),
                       value);
            };

            // Validate and update rolling-window energy sensors (kWh)
            auto update_rolling_energy_sensor = [&](const std::string &line,
                                                    const std::string &obis,
                                                    auto &sensor,
                                                    float &prev_value,
                                                    float min_range,
                                                    float max_range) {
              float value = parse_obis_value(line, obis);
              if (isnan(value)) {
                return;
              }

              // Validate: energy must be in valid range
              if (value < min_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.2f<%.1f",
                                       trim_for_log(obis), value, min_range);
                telegram_corrupted = true;
                return;
              }
              if (value > max_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.2f>%.1f",
                                       trim_for_log(obis), value, max_range);
                telegram_corrupted = true;
                return;
              }

              // Validate: change magnitude must be reasonable (allow increase
              // OR decrease)
              if (prev_value >= 0 &&
                  fabs(value - prev_value) > MAX_ROLLING_ENERGY_CHANGE) {
                LOG_WARNING_IF_ENABLED(
                    "Reject %s: |Δ|%.2f>%.0f", trim_for_log(obis),
                    fabs(value - prev_value), MAX_ROLLING_ENERGY_CHANGE);
                telegram_corrupted = true;
                return;
              }

              sensor->publish_state(value);
              prev_value = value;
              ESP_LOGD("meter", "Updated (rolling) %s: %.4f kWh",
                       trim_for_log(obis), value);
            };

            // Generic function to validate and update sensors with spike
            // protection
            auto update_spike_protected_sensor = [&](const std::string &line,
                                                     const std::string &obis,
                                                     auto &sensor,
                                                     float &prev_value,
                                                     float max_change,
                                                     const char *unit,
                                                     float min_range,
                                                     float max_range) {
              float value = parse_obis_value(line, obis);
              if (isnan(value)) {
                return;
              }

              // Validate: value must be in valid range
              if (value < min_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.1f<%.1f",
                                       trim_for_log(obis), value, min_range);
                telegram_corrupted = true;
                return;
              }
              if (value > max_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.1f>%.1f",
                                       trim_for_log(obis), value, max_range);
                telegram_corrupted = true;
                return;
              }

              // Validate: change must be reasonable (or first reading)
              if (prev_value >= 0 && fabs(value - prev_value) > max_change) {
                LOG_WARNING_IF_ENABLED(
                    "Reject %s: Δ%.1f>%.0f%s", trim_for_log(obis),
                    fabs(value - prev_value), max_change, unit);
                telegram_corrupted = true;
                return;
              }

              sensor->publish_state(value);
              prev_value = value;
              ESP_LOGD("meter", "Updated %s: %g %s", trim_for_log(obis), value,
                       unit);
            };

            // Convenience wrappers for specific sensor types
            auto update_power_sensor = [&](const std::string &line,
                                           const std::string &obis,
                                           auto &sensor, float &prev_value) {
              update_spike_protected_sensor(
                  line, obis, sensor, prev_value, MAX_POWER_CHANGE, "W",
                  MIN_POWER_VALUE, MAX_ABSOLUTE_POWER);
            };

            auto update_current_sensor = [&](const std::string &line,
                                             const std::string &obis,
                                             auto &sensor, float &prev_value) {
              update_spike_protected_sensor(line, obis, sensor, prev_value,
                                            MAX_CURRENT_CHANGE, "A",
                                            MIN_CURRENT, MAX_CURRENT);
            };

            // Generic function to update numeric sensors with range validation
            auto update_numeric_sensor = [&](const std::string &line,
                                             const std::string &obis,
                                             auto &sensor, const char *unit,
                                             float min_range, float max_range) {
              float value = parse_obis_value(line, obis);
              if (isnan(value)) {
                return;
              }

              // Validate: value must be in valid range
              if (value < min_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.1f<%.1f",
                                       trim_for_log(obis), value, min_range);
                telegram_corrupted = true;
                return;
              }
              if (value > max_range) {
                LOG_WARNING_IF_ENABLED("Reject %s: %.1f>%.1f",
                                       trim_for_log(obis), value, max_range);
                telegram_corrupted = true;
                return;
              }

              sensor->publish_state(value);
              ESP_LOGD("meter", "Updated %s: %.3f %s", trim_for_log(obis),
                       value, unit);
            };

            // Parse and publish text sensor values with corruption filtering -
            // hash-based for memory efficiency
            auto update_text_sensor_filtered =
                [&](const std::string &line, const std::string &obis,
                    auto &sensor, uint32_t &last_hash, int &count) {
                  std::string_view value_sv =
                      parse_obis_string_value(line, obis, ')');
                  if (value_sv.empty()) {
                    return;
                  }

                  uint32_t current_hash = calculate_hash(value_sv);

                  // A new value counts as its first reading.
                  if (current_hash != last_hash) {
                    last_hash = current_hash;
                    count = 1;
                  } else if (count < TEXT_CONFIRMATIONS) {
                    count++;
                  }

                  if (count < TEXT_CONFIRMATIONS) {
                    ESP_LOGD("meter", "Buf %s: %s (%d/%d)", trim_for_log(obis),
                             trim_sv_for_log(value_sv), count,
                             TEXT_CONFIRMATIONS);
                    return;
                  }

                  // Only allocate string when we're ready to publish
                  std::string value_str(value_sv);
                  sensor->publish_state(value_str);
                  ESP_LOGD("meter", "Updated %s: %s (%dx)", trim_for_log(obis),
                           trim_sv_for_log(value_str), TEXT_CONFIRMATIONS);
                };

            // Calculate hash values for all OBIS codes at compile time
            constexpr uint32_t HASH_TOTAL_CONSUMPTION =
                calculate_hash("${obis_total_consumption}");
            constexpr uint32_t HASH_TOTAL_FEED_IN =
                calculate_hash("${obis_total_feed_in}");
            constexpr uint32_t HASH_CONSUMPTION_1D =
                calculate_hash("${obis_consumption_1d}");
            constexpr uint32_t HASH_CONSUMPTION_7D =
                calculate_hash("${obis_consumption_7d}");
            constexpr uint32_t HASH_CONSUMPTION_30D =
                calculate_hash("${obis_consumption_30d}");
            constexpr uint32_t HASH_CONSUMPTION_365D =
                calculate_hash("${obis_consumption_365d}");
            constexpr uint32_t HASH_CONSUMPTION_T1 =
                calculate_hash("${obis_consumption_t1}");
            constexpr uint32_t HASH_CONSUMPTION_T2 =
                calculate_hash("${obis_consumption_t2}");
            constexpr uint32_t HASH_CONSUMPTION_SINCE_RESET =
                calculate_hash("${obis_consumption_since_reset}");
            constexpr uint32_t HASH_CURRENT_POWER =
                calculate_hash("${obis_current_power}");
            constexpr uint32_t HASH_POWER_L1 =
                calculate_hash("${obis_power_l1}");
            constexpr uint32_t HASH_POWER_L2 =
                calculate_hash("${obis_power_l2}");
            constexpr uint32_t HASH_POWER_L3 =
                calculate_hash("${obis_power_l3}");
            constexpr uint32_t HASH_VOLTAGE_L1 =
                calculate_hash("${obis_voltage_l1}");
            constexpr uint32_t HASH_VOLTAGE_L2 =
                calculate_hash("${obis_voltage_l2}");
            constexpr uint32_t HASH_VOLTAGE_L3 =
                calculate_hash("${obis_voltage_l3}");
            constexpr uint32_t HASH_CURRENT_L1 =
                calculate_hash("${obis_current_l1}");
            constexpr uint32_t HASH_CURRENT_L2 =
                calculate_hash("${obis_current_l2}");
            constexpr uint32_t HASH_CURRENT_L3 =
                calculate_hash("${obis_current_l3}");
            constexpr uint32_t HASH_FREQUENCY =
                calculate_hash("${obis_frequency}");
            constexpr uint32_t HASH_PHASE_ANGLE_UL2_UL1 =
                calculate_hash("${obis_phase_angle_ul2_ul1}");
            constexpr uint32_t HASH_PHASE_ANGLE_UL3_UL1 =
                calculate_hash("${obis_phase_angle_ul3_ul1}");
            constexpr uint32_t HASH_PHASE_ANGLE_IL1_UL1 =
                calculate_hash("${obis_phase_angle_il1_ul1}");
            constexpr uint32_t HASH_PHASE_ANGLE_IL2_UL2 =
                calculate_hash("${obis_phase_angle_il2_ul2}");
            constexpr uint32_t HASH_PHASE_ANGLE_IL3_UL3 =
                calculate_hash("${obis_phase_angle_il3_ul3}");
            constexpr uint32_t HASH_SERIAL_NUMBER =
                calculate_hash("${obis_serial_number}");
            constexpr uint32_t HASH_FIRMWARE_VERSION =
                calculate_hash("${obis_firmware_version}");
            constexpr uint32_t HASH_PARAMETER_CRC =
                calculate_hash("${obis_parameter_crc}");
            constexpr uint32_t HASH_STATUS_REGISTER =
                calculate_hash("${obis_status_register}");

            // Extract OBIS code from the current line
            std::string_view current_obis = extract_obis_code(x);

            // Process only if we have a valid OBIS code
            if (!current_obis.empty()) {
              ESP_LOGD("meter", "Processing OBIS: %s",
                       trim_sv_for_log(current_obis));

              // Calculate hash of current OBIS code for efficient switch
              uint32_t obis_hash = calculate_hash(current_obis);

              // Convert string_view to string only when we have a match (more
              // efficient)
              std::string obis_str(current_obis);

              // Process the line based on the identified OBIS code using
              // hash-based switch
              switch (obis_hash) {
                case HASH_TOTAL_CONSUMPTION:
                  if (ENABLE_CORE_SENSORS) {
                    update_energy_sensor(x, obis_str, id(total_consumption),
                                         id(prev_total_consumption),
                                         MIN_ENERGY_VALUE, MAX_ENERGY_TOTAL);
                  }
                  break;
                case HASH_TOTAL_FEED_IN:
                  if (ENABLE_FEED_IN_SENSORS) {
                    update_energy_sensor(x, obis_str, id(total_feed_in),
                                         id(prev_total_feed_in),
                                         MIN_ENERGY_VALUE, MAX_ENERGY_TOTAL);
                  }
                  break;
                case HASH_CONSUMPTION_1D:
                  if (ENABLE_ROLLING_WINDOW_SENSORS) {
                    update_rolling_energy_sensor(
                        x, obis_str, id(consumption_1d),
                        id(prev_consumption_1d), MIN_ENERGY_VALUE,
                        MAX_CONSUMPTION_1D);
                  }
                  break;
                case HASH_CONSUMPTION_7D:
                  if (ENABLE_ROLLING_WINDOW_SENSORS) {
                    update_rolling_energy_sensor(
                        x, obis_str, id(consumption_7d),
                        id(prev_consumption_7d), MIN_ENERGY_VALUE,
                        MAX_CONSUMPTION_7D);
                  }
                  break;
                case HASH_CONSUMPTION_30D:
                  if (ENABLE_ROLLING_WINDOW_SENSORS) {
                    update_rolling_energy_sensor(
                        x, obis_str, id(consumption_30d),
                        id(prev_consumption_30d), MIN_ENERGY_VALUE,
                        MAX_CONSUMPTION_30D);
                  }
                  break;
                case HASH_CONSUMPTION_365D:
                  if (ENABLE_ROLLING_WINDOW_SENSORS) {
                    update_rolling_energy_sensor(
                        x, obis_str, id(consumption_365d),
                        id(prev_consumption_365d), MIN_ENERGY_VALUE,
                        MAX_CONSUMPTION_365D);
                  }
                  break;
                case HASH_CONSUMPTION_T1:
                  if (ENABLE_TARIFF_SENSORS) {
                    update_energy_sensor(x, obis_str, id(consumption_t1),
                                         id(prev_consumption_t1),
                                         MIN_ENERGY_VALUE, MAX_ENERGY_TOTAL);
                  }
                  break;
                case HASH_CONSUMPTION_T2:
                  if (ENABLE_TARIFF_SENSORS) {
                    update_energy_sensor(x, obis_str, id(consumption_t2),
                                         id(prev_consumption_t2),
                                         MIN_ENERGY_VALUE, MAX_ENERGY_TOTAL);
                  }
                  break;
                case HASH_CONSUMPTION_SINCE_RESET:
                  if (ENABLE_CONSUMPTION_SINCE_RESET_SENSORS) {
                    update_energy_sensor(x, obis_str,
                                         id(consumption_since_reset),
                                         id(prev_consumption_since_reset),
                                         MIN_ENERGY_VALUE, MAX_ENERGY_TOTAL);
                  }
                  break;
                case HASH_CURRENT_POWER:
                  if (id(positioning_mode).state) {
                    std::string_view raw_text = parse_obis_string_value(
                        x, obis_str, '*');
                    if (!raw_text.empty()) {
                      float raw_value = parse_float(raw_text);
                      if (!isnan(raw_value)) {
                        id(raw_current_power)->publish_state(raw_value);
                        ESP_LOGI("meter", "[positioning] Power: %.0f W",
                                 raw_value);
                      }
                    }
                  }
                  if (ENABLE_CORE_SENSORS) {
                    update_power_sensor(
                        x, obis_str, id(current_power),
                        id(prev_current_power));
                  }
                  break;
                case HASH_POWER_L1:
                  if (ENABLE_PHASE_POWER_SENSORS) {
                    update_power_sensor(x, obis_str, id(power_l1),
                                        id(prev_power_l1));
                  }
                  break;
                case HASH_POWER_L2:
                  if (ENABLE_PHASE_POWER_SENSORS) {
                    update_power_sensor(x, obis_str, id(power_l2),
                                        id(prev_power_l2));
                  }
                  break;
                case HASH_POWER_L3:
                  if (ENABLE_PHASE_POWER_SENSORS) {
                    update_power_sensor(x, obis_str, id(power_l3),
                                        id(prev_power_l3));
                  }
                  break;
                case HASH_VOLTAGE_L1:
                  if (ENABLE_VOLTAGE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(voltage_l1), "V",
                                          MIN_VOLTAGE, MAX_VOLTAGE);
                  }
                  break;
                case HASH_VOLTAGE_L2:
                  if (ENABLE_VOLTAGE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(voltage_l2), "V",
                                          MIN_VOLTAGE, MAX_VOLTAGE);
                  }
                  break;
                case HASH_VOLTAGE_L3:
                  if (ENABLE_VOLTAGE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(voltage_l3), "V",
                                          MIN_VOLTAGE, MAX_VOLTAGE);
                  }
                  break;
                case HASH_CURRENT_L1:
                  if (id(positioning_mode).state) {
                    std::string_view raw_text = parse_obis_string_value(
                        x, obis_str, '*');
                    if (!raw_text.empty()) {
                      float raw_value = parse_float(raw_text);
                      if (!isnan(raw_value))
                        id(raw_current_l1)->publish_state(raw_value);
                    }
                  }
                  if (ENABLE_CURRENT_SENSORS) {
                    update_current_sensor(
                        x, obis_str, id(current_l1),
                        id(prev_current_l1));
                  }
                  break;
                case HASH_CURRENT_L2:
                  if (id(positioning_mode).state) {
                    std::string_view raw_text = parse_obis_string_value(
                        x, obis_str, '*');
                    if (!raw_text.empty()) {
                      float raw_value = parse_float(raw_text);
                      if (!isnan(raw_value))
                        id(raw_current_l2)->publish_state(raw_value);
                    }
                  }
                  if (ENABLE_CURRENT_SENSORS) {
                    update_current_sensor(
                        x, obis_str, id(current_l2),
                        id(prev_current_l2));
                  }
                  break;
                case HASH_CURRENT_L3:
                  if (id(positioning_mode).state) {
                    std::string_view raw_text = parse_obis_string_value(
                        x, obis_str, '*');
                    if (!raw_text.empty()) {
                      float raw_value = parse_float(raw_text);
                      if (!isnan(raw_value))
                        id(raw_current_l3)->publish_state(raw_value);
                    }
                  }
                  if (ENABLE_CURRENT_SENSORS) {
                    update_current_sensor(
                        x, obis_str, id(current_l3),
                        id(prev_current_l3));
                  }
                  break;
                case HASH_FREQUENCY:
                  if (ENABLE_FREQUENCY_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(frequency), "Hz",
                                          MIN_FREQUENCY, MAX_FREQUENCY);
                  }
                  break;
                case HASH_PHASE_ANGLE_UL2_UL1:
                  if (ENABLE_PHASE_ANGLE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(phase_angle_ul2_ul1),
                                          "deg", MIN_PHASE_ANGLE,
                                          MAX_PHASE_ANGLE);
                  }
                  break;
                case HASH_PHASE_ANGLE_UL3_UL1:
                  if (ENABLE_PHASE_ANGLE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(phase_angle_ul3_ul1),
                                          "deg", MIN_PHASE_ANGLE,
                                          MAX_PHASE_ANGLE);
                  }
                  break;
                case HASH_PHASE_ANGLE_IL1_UL1:
                  if (ENABLE_PHASE_ANGLE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(phase_angle_il1_ul1),
                                          "deg", MIN_PHASE_ANGLE,
                                          MAX_PHASE_ANGLE);
                  }
                  break;
                case HASH_PHASE_ANGLE_IL2_UL2:
                  if (ENABLE_PHASE_ANGLE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(phase_angle_il2_ul2),
                                          "deg", MIN_PHASE_ANGLE,
                                          MAX_PHASE_ANGLE);
                  }
                  break;
                case HASH_PHASE_ANGLE_IL3_UL3:
                  if (ENABLE_PHASE_ANGLE_SENSORS) {
                    update_numeric_sensor(x, obis_str, id(phase_angle_il3_ul3),
                                          "deg", MIN_PHASE_ANGLE,
                                          MAX_PHASE_ANGLE);
                  }
                  break;
                case HASH_SERIAL_NUMBER:
                  if (ENABLE_DIAGNOSTIC_SENSORS) {
                    update_text_sensor_filtered(x, obis_str, id(serial_number),
                                                id(serial_number_last_hash),
                                                id(serial_number_count));
                  }
                  break;
                case HASH_FIRMWARE_VERSION:
                  if (ENABLE_DIAGNOSTIC_SENSORS) {
                    update_text_sensor_filtered(x, obis_str,
                                                id(firmware_version),
                                                id(firmware_version_last_hash),
                                                id(firmware_version_count));
                  }
                  break;
                case HASH_PARAMETER_CRC:
                  if (ENABLE_DIAGNOSTIC_SENSORS) {
                    update_text_sensor_filtered(x, obis_str, id(parameter_crc),
                                                id(parameter_crc_last_hash),
                                                id(parameter_crc_count));
                  }
                  break;
                case HASH_STATUS_REGISTER:
                  if (ENABLE_DIAGNOSTIC_SENSORS) {
                    update_text_sensor_filtered(x, obis_str,
                                                id(status_register),
                                                id(status_register_last_hash),
                                                id(status_register_count));
                  }
                  break;
                default:
                  ESP_LOGD("meter",
                           "Unknown OBIS code: %s (hash: 0x%08" PRIX32 ")",
                           trim_sv_for_log(current_obis), obis_hash);
                  break;
              }
            }
            // An empty current_obis was already logged and flagged as corrupt
            // by extract_obis_code.

            // Count corrupted telegrams
            if (telegram_corrupted) {
              id(corruption_count)++;
            }
            #undef LOG_WARNING_IF_ENABLED

