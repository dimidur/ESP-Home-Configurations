  # Communication quality sensor
  - platform: template
    name: "OBIS Valid Frame Rate"
    id: obis_valid_frame_rate
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: ${disabled_quality_sensors}
    update_interval: ${quality_sensor_update_interval}
    lambda: |-
      // Both counters are halved, keeping their ratio, once either reaches
      // this, long before a uint32_t could overflow.
      constexpr uint32_t COUNTER_HALVING_THRESHOLD = 4000000u;
      constexpr float PERCENT = 100.0f;

      // Every writer keeps corruption_count <= total_frames_received.
      uint32_t total_telegrams = id(total_frames_received);
      uint32_t corruption_events = id(corruption_count);

      // Overflow protection
      if (total_telegrams >= COUNTER_HALVING_THRESHOLD ||
          corruption_events >= COUNTER_HALVING_THRESHOLD) {
        uint32_t new_total = total_telegrams / 2;
        uint32_t new_corruption = corruption_events / 2;

        id(total_frames_received) = new_total;
        id(corruption_count) = new_corruption;
        total_telegrams = new_total;
        corruption_events = new_corruption;
      }

      if (total_telegrams == 0) return 0.0;

      // Use uint32_t to prevent underflow, then cast to float
      uint32_t successfully_processed = total_telegrams - corruption_events;

      return (float(successfully_processed) / float(total_telegrams)) *
             PERCENT;
    filters:
      - or:
          - throttle: ${quality_sensor_throttle}
          - delta: ${frame_rate_sensor_delta}
  # Reader activity, counted only while positioning mode is ON (see the
  # uart_lines_seen global). Compare with total_frames_received:
  #   grows, total_frames_received flat: the filter rejects every line
  #   (garbled text)
  #   both grow, valid frame rate falls: SML telegrams are being dropped
  #   both frozen: nothing arrives (probe disconnected or meter silent)
  - platform: template
    name: "UART Lines Seen"
    id: uart_lines_seen_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: ${disabled_quality_sensors}
    update_interval: ${quality_sensor_update_interval}
    lambda: return (float)id(uart_lines_seen);
    filters:
      - or:
          - throttle: ${quality_sensor_throttle}
          - delta: ${uart_lines_sensor_delta}
  # Positioning mode raw sensors: no validation, no throttle, only active
  # when positioning_mode switch is on (cleared to unavailable on turn-off)
  - platform: template
    name: "Raw Current Power"
    id: raw_current_power
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:lightning-bolt"
  - platform: template
    name: "Raw Current L1"
    id: raw_current_l1
    unit_of_measurement: A
    accuracy_decimals: 2
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:current-ac"
  - platform: template
    name: "Raw Current L2"
    id: raw_current_l2
    unit_of_measurement: A
    accuracy_decimals: 2
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:current-ac"
  - platform: template
    name: "Raw Current L3"
    id: raw_current_l3
    unit_of_measurement: A
    accuracy_decimals: 2
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:current-ac"

# Reset buttons
button:
  - platform: template
    name: "Reset Validation State"
    id: reset_validation_state
    icon: "mdi:backup-restore"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(prev_total_consumption) = -1.0;
          id(prev_total_feed_in) = -1.0;
          id(prev_consumption_1d) = -1.0;
          id(prev_consumption_7d) = -1.0;
          id(prev_consumption_30d) = -1.0;
          id(prev_consumption_365d) = -1.0;
          id(prev_current_power) = -1.0;
          id(prev_power_l1) = -1.0;
          id(prev_power_l2) = -1.0;
          id(prev_power_l3) = -1.0;
          id(prev_consumption_t1) = -1.0;
          id(prev_consumption_t2) = -1.0;
          id(prev_consumption_since_reset) = -1.0;
          id(prev_current_l1) = -1.0;
          id(prev_current_l2) = -1.0;
          id(prev_current_l3) = -1.0;
          id(serial_number_last_hash) = 0;
          id(serial_number_count) = 0;
          id(firmware_version_last_hash) = 0;
          id(firmware_version_count) = 0;
          id(parameter_crc_last_hash) = 0;
          id(parameter_crc_count) = 0;
          id(status_register_last_hash) = 0;
          id(status_register_count) = 0;
          ESP_LOGI("meter", "Validation state reset");
  - platform: template
    name: "Reset Communication Quality"
    id: reset_communication_quality
    icon: "mdi:refresh"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(total_frames_received) = 0;
          id(corruption_count) = 0;
          id(uart_lines_seen) = 0;
          ESP_LOGI("meter", "Quality counters reset");
  - platform: restart
    name: "Restart Device"
    id: restart_device
    icon: "mdi:restart"
    entity_category: diagnostic

# Warning logs control switch
switch:
  - platform: template
    name: "Enable Warning Logs"
    id: enable_warning_logs
    icon: "mdi:message-alert"
    entity_category: diagnostic
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Positioning Mode"
    id: positioning_mode
    icon: "mdi:crosshairs-gps"
    entity_category: diagnostic
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - lambda: |-
          id(raw_current_power)->publish_state(NAN);
          id(raw_current_l1)->publish_state(NAN);
          id(raw_current_l2)->publish_state(NAN);
          id(raw_current_l3)->publish_state(NAN);

# Scripts
script:
  - id: memory_sweep_hack
    mode: single
    then:
      - lambda: |-
          // This is a hack to force the ESP8266 heap manager to reduce
          // fragmentation by allocating and freeing memory in a loop.
          // Only run on ESP8266
          #ifdef ARDUINO_ARCH_ESP8266
            constexpr size_t BLOCK_SAFETY_MARGIN = ${heap_sweep_block_margin};
            constexpr size_t MIN_FREE_HEAP_TO_START =
                ${heap_sweep_min_free_to_start};
            constexpr size_t MIN_FREE_HEAP_DURING =
                ${heap_sweep_min_free_during};
            constexpr float MAX_FRAGMENTATION_PERCENT =
                ${heap_sweep_max_fragmentation_percent};
            constexpr size_t MAX_BLOCK_DIVISOR =
                ${heap_sweep_max_block_divisor};
            constexpr size_t MIN_SWEEP_BLOCK = ${heap_sweep_min_block};
            constexpr float PERCENT = 100.0f;

            // Safety checks: Don't sweep if memory is already tight
            size_t free_heap = ESP.getFreeHeap();
            size_t max_block = ESP.getMaxFreeBlockSize() - BLOCK_SAFETY_MARGIN;

            if (free_heap < MIN_FREE_HEAP_TO_START) {
              return;
            }

            float fragmentation =
                ((float)(free_heap - max_block) / free_heap) * PERCENT;
            if (fragmentation > MAX_FRAGMENTATION_PERCENT) {
              return;
            }

            // Use allocations with more frequent yields
            // This reduces the risk of interfering with UART/MQTT operations
            for (size_t divisor = 1; divisor <= MAX_BLOCK_DIVISOR;
                 divisor <<= 1) {
              size_t len = max_block / divisor;
              if (len < MIN_SWEEP_BLOCK) {
                break;
              }

              void* block = malloc(len);
              if (block) {
                // Brief operation, then yield
                free(block);

                // Feed watchdog (prevent resets)
                App.feed_wdt();

                // Allow background tasks to run (maintain WiFi, etc.)
                esp_yield();

                // Abort if the heap got too low during the sweep
                if (ESP.getFreeHeap() < MIN_FREE_HEAP_DURING) {
                  break;
                }
              } else {
                ESP_LOGW("memory_sweep", "Failed to allocate %u bytes", len);
                break;
              }
            }

            size_t new_free_heap = ESP.getFreeHeap();
            size_t new_max_block = ESP.getMaxFreeBlockSize();
            float new_fragmentation =
                ((float)(new_free_heap - new_max_block) / new_free_heap) *
                PERCENT;

            ESP_LOGI("memory_sweep",
                     "Completed - heap: %u->%u, max_block: %u->%u, "
                     "frag: %.1f%%->%.1f%%",
                     free_heap, new_free_heap, max_block, new_max_block,
                     fragmentation, new_fragmentation);
          #endif

interval:
  - interval: ${heap_sweep_interval}
    startup_delay: ${heap_sweep_startup_delay}
    then:
      - script.execute: memory_sweep_hack
